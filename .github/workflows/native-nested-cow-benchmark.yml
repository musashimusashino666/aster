name: Temporary nested Native COW benchmark

on:
  push:
    branches:
      - fix/native-cow-temporary-reads
    paths:
      - internal/codegen/ir_codegen.go
      - internal/codegen/preamble/runtime.go
      - tests/array_assignment_benchmark_test.go
      - tests/array_cow_sharing_boundaries_test.go
      - .github/workflows/native-nested-cow-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          cache: true

      - name: Compare parent revision and pushed revision on the same runner
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" || ! git show "${BEFORE_SHA}:tests/array_assignment_benchmark_test.go" >/dev/null 2>&1; then
            echo "The push parent does not contain the nested benchmark; measuring the pushed revision only."
            git checkout "${AFTER_SHA}"
            go test ./tests -run '^$' -bench '^BenchmarkNestedArrayElementAssignmentNative$' -benchmem -count=5
            exit 0
          fi
          echo "=== baseline ${BEFORE_SHA} ==="
          git checkout "${BEFORE_SHA}"
          go test ./tests -run '^$' -bench '^BenchmarkNestedArrayElementAssignmentNative$' -benchmem -count=5
          echo "=== candidate ${AFTER_SHA} ==="
          git checkout "${AFTER_SHA}"
          go test ./tests -run '^$' -bench '^BenchmarkNestedArrayElementAssignmentNative$' -benchmem -count=5
