name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', 'stable']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build CLI
        run: make build

      - name: Run language examples
        run: make examples

      - name: Check native array index bounds on 32-bit target
        run: GOARCH=386 go test ./tests -run TestArrayIndexBoundsMatchBackends/large_positive_index

  benchmark-array-assignment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/perf/amortize-native-array-benchmark'
    name: Array assignment benchmark (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Run array assignment benchmarks
        run: go test ./tests -run '^$' -bench '^BenchmarkArrayElementAssignment' -benchmem -count=5
