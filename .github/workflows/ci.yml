name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', 'stable']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify external Go module installation at this revision
        env:
          ASTER_INSTALL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          install_dir="$(mktemp -d)"
          GOBIN="$install_dir" GOPROXY=direct go install "github.com/musashimusashino666/aster/cmd/aster@${ASTER_INSTALL_REVISION}"
          "$install_dir/aster" version

      - name: Verify latest Go module installation on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GOBIN: ${{ runner.temp }}/aster-install-latest
        run: |
          mkdir -p "$GOBIN"
          GOPROXY=direct go install github.com/musashimusashino666/aster/cmd/aster@latest
          "$GOBIN/aster" version

      - name: Check formatting
        run: make fmt-check

      - name: Check benchmark and resource-validation script syntax
        run: |
          bash -n scripts/bench-array-assignment.sh
          bash -n scripts/bench-native-memory.sh
          bash -n scripts/test-resource-isolation.sh

      - name: Smoke-test Native child-process memory benchmark
        run: ASTER_BENCH_REPEATS=1 bash scripts/bench-native-memory.sh bench/native-memory-smoke.out

      - name: Run tests
        run: go test ./...

      - name: Report cgroup integration capability and skips
        run: go test -count=1 -v ./internal/resource

      - name: Build all packages
        run: go build ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build CLI
        run: make build

      - name: Run language examples
        run: make examples

      - name: Check native array index bounds on 32-bit target
        run: GOARCH=386 go test ./tests -run TestArrayIndexBoundsMatchBackends/large_positive_index
