name: Temporary Native COW benchmark comparison

on:
  push:
    branches:
      - perf/native-array-copy-on-write

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Benchmark pre-Native-COW baseline on this runner
        run: |
          git worktree add /tmp/aster-native-array-baseline fde20109e77314a31d54a9b4fdd47bb3f3710c9e
          cd /tmp/aster-native-array-baseline
          bash scripts/bench-array-assignment.sh /tmp/native-array-assignment-baseline.out
      - name: Benchmark Native COW candidate on the same runner
        run: bash scripts/bench-array-assignment.sh /tmp/native-array-assignment-cow.out
