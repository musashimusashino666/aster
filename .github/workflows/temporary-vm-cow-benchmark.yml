name: Temporary VM COW benchmark comparison

on:
  push:
    branches:
      - perf/vm-array-copy-on-write

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Benchmark baseline on this runner
        run: |
          git worktree add /tmp/aster-array-baseline 990ee8b6b1780afeeddcf9780aff9a82943a7750
          cd /tmp/aster-array-baseline
          bash scripts/bench-array-assignment.sh /tmp/array-assignment-baseline.out
      - name: Benchmark COW candidate on the same runner
        run: bash scripts/bench-array-assignment.sh /tmp/array-assignment-cow.out
