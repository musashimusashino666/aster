name: Temporary VM COW benchmark measurement

on:
  push:
    branches:
      - perf/vm-array-copy-on-write

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Run reproducible array-assignment benchmark
        run: bash scripts/bench-array-assignment.sh bench/array-assignment-cow-trial.out
